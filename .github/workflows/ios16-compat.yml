name: iOS 16.5 Compatibility Build

on:
  push:
    branches: [ios16.5.1]
  pull_request:
    branches: [ios16.5.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SpektraMobileApp
        run: xcodegen generate

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project SpektraMobileApp/SpektraMobile.xcodeproj \
            -scheme SpektraMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project SpektraMobileApp/SpektraMobile.xcodeproj \
            -scheme SpektraMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/Payload
          cp -R build/DeviceDerivedData/Build/Products/Release-iphoneos/SpektraMobile.app build/Payload/
          (cd build && zip -qr Spektrafilm-iOS16.5-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Spektrafilm-iOS16.5-unsigned-IPA
          path: build/Spektrafilm-iOS16.5-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
